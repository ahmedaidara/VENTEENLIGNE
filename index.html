<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>DAKAR CHICKEN EXPRESS - Commande en ligne</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f5f0e6 0%, #fff5e8 100%);
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            min-height: 100vh;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            padding: 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .logo-img {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #f5a623;
        }

        .logo h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
        }

        .logo span {
            color: #f5a623;
        }

        .slogan {
            font-size: 0.8rem;
            opacity: 0.8;
        }

        /* Container principal */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Catégories */
        .categories-title {
            text-align: center;
            margin: 30px 0;
            font-size: 1.8rem;
            color: #1a1a2e;
            position: relative;
        }

        .categories-title:after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background: #f5a623;
            margin: 10px auto;
            border-radius: 5px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .product-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .product-image {
            height: 200px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .product-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #f5a623;
            color: #1a1a2e;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .product-info {
            padding: 20px;
        }

        .product-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #1a1a2e;
            margin-bottom: 5px;
        }

        .product-weight {
            color: #666;
            font-size: 0.8rem;
            margin-bottom: 10px;
        }

        .product-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #f5a623;
            margin-bottom: 15px;
        }

        .product-price small {
            font-size: 0.8rem;
            color: #666;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 15px;
        }

        .quantity-btn {
            background: #f0f0f0;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .quantity-btn:hover {
            background: #f5a623;
            color: white;
        }

        .quantity-value {
            font-size: 1.2rem;
            font-weight: bold;
            min-width: 50px;
            text-align: center;
        }

        .add-to-cart {
            width: 100%;
            margin-top: 15px;
            background: linear-gradient(135deg, #f5a623, #e67e22);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .add-to-cart:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 15px rgba(245,166,35,0.3);
        }

        /* Panier flottant */
        .cart-fab {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: linear-gradient(135deg, #f5a623, #e67e22);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            z-index: 200;
            transition: all 0.3s;
        }

        .cart-fab:hover {
            transform: scale(1.1);
        }

        .cart-fab i {
            font-size: 2rem;
            color: white;
        }

        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ff4757;
            color: white;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: bold;
        }

        /* Modal panier */
        .cart-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .cart-modal.active {
            display: flex;
        }

        .cart-content {
            background: white;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            border-radius: 20px;
            overflow: hidden;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .cart-header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-header h3 {
            margin: 0;
        }

        .close-cart {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .cart-items {
            max-height: 400px;
            overflow-y: auto;
            padding: 15px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .cart-item-info h4 {
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .cart-item-info p {
            font-size: 0.8rem;
            color: #f5a623;
            font-weight: bold;
        }

        .cart-item-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cart-item-actions button {
            background: #f0f0f0;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 8px;
            cursor: pointer;
        }

        .cart-total {
            padding: 20px;
            background: #f8f9fa;
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .cart-total span {
            color: #f5a623;
        }

        .checkout-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
        }

        .checkout-btn:hover {
            transform: scale(1.02);
        }

        /* Modal formulaire */
        .form-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1001;
            align-items: center;
            justify-content: center;
        }

        .form-modal.active {
            display: flex;
        }

        .form-content {
            background: white;
            width: 90%;
            max-width: 500px;
            border-radius: 20px;
            padding: 25px;
            max-height: 85vh;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #333;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            border-color: #f5a623;
            outline: none;
        }

        .submit-order {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #f5a623, #e67e22);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
        }

        /* Notification */
        .notification {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            z-index: 2000;
            display: none;
            animation: fadeInOut 2s ease;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        footer {
            text-align: center;
            padding: 30px;
            background: #1a1a2e;
            color: #888;
            margin-top: 50px;
        }

        @media (max-width: 768px) {
            .products-grid {
                grid-template-columns: 1fr;
            }
            .container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <img src="https://i.postimg.cc/0QBKNcGj/photo-5782651308169956527-x.jpg" alt="Logo" class="logo-img">
            <h1>DAKAR <span>CHICKEN</span> EXPRESS</h1>
        </div>
        <div class="slogan">Le goût authentique du poulet local - Livraison rapide à Dakar</div>
    </div>

    <div class="container">
        <h2 class="categories-title">Nos Poulets</h2>
        <div class="products-grid" id="productsGrid"></div>
    </div>

    <!-- Panier flottant -->
    <div class="cart-fab" id="cartFab">
        <i class="fas fa-shopping-cart"></i>
        <span class="cart-count" id="cartCount">0</span>
    </div>

    <!-- Modal panier -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-content">
            <div class="cart-header">
                <h3><i class="fas fa-shopping-cart"></i> Mon panier</h3>
                <button class="close-cart" id="closeCartBtn">&times;</button>
            </div>
            <div class="cart-items" id="cartItems"></div>
            <div class="cart-total">
                TOTAL: <span id="cartTotal">0 F CFA</span>
            </div>
            <button class="checkout-btn" id="checkoutBtn">📦 Passer la commande</button>
        </div>
    </div>

    <!-- Modal formulaire client -->
    <div class="form-modal" id="formModal">
        <div class="form-content">
            <h2 style="margin-bottom: 20px; color: #1a1a2e;">Informations de livraison</h2>
            <form id="orderForm">
                <div class="form-group">
                    <label>Nom complet *</label>
                    <input type="text" id="fullName" required placeholder="Ex: Alioune Diop">
                </div>
                <div class="form-group">
                    <label>Téléphone *</label>
                    <input type="tel" id="phone" required placeholder="Ex: 77 777 77 77">
                </div>
                <div class="form-group">
                    <label>Adresse de livraison *</label>
                    <textarea id="address" rows="2" required placeholder="Ex: Dakar, Yoff, Villa N°123"></textarea>
                </div>
                <div class="form-group">
                    <label>Email (optionnel)</label>
                    <input type="email" id="email" placeholder="Ex: client@email.com">
                </div>
                <button type="submit" class="submit-order">✅ Confirmer ma commande</button>
            </form>
        </div>
    </div>

    <div class="notification" id="notification">✓ Ajouté au panier !</div>

    <footer>
        <p>&copy; 2026 DAKAR CHICKEN EXPRESS - Tous droits réservés</p>
        <p style="margin-top: 10px;">Livraison gratuite à partir de 50 000 F CFA</p>
    </footer>

    <script>
        // Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAAQ9G3w94aM7iGc_ufHMzdCvrwzzEzlhI",
            authDomain: "poulailler-3515e.firebaseapp.com",
            projectId: "poulailler-3515e",
            storageBucket: "poulailler-3515e.firebasestorage.app",
            messagingSenderId: "482441929117",
            appId: "1:482441929117:web:7970df401b0125560acf74"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Catégories de poulets avec images
        const categories = [
            { id: 1, name: "Très petits", weight: "1.0 - 1.1 kg", price: 2000, image: "https://images.unsplash.com/photo-1587593819583-6c44a2ca65e5?w=400", bgColor: "#fff3e0" },
            { id: 2, name: "Petits", weight: "1.2 kg", price: 2500, image: "https://images.unsplash.com/photo-1587593819583-6c44a2ca65e5?w=400", bgColor: "#fff3e0" },
            { id: 3, name: "Moyens-petits", weight: "1.3 - 1.4 kg", price: 3000, image: "https://images.unsplash.com/photo-1587593819583-6c44a2ca65e5?w=400", bgColor: "#fff3e0" },
            { id: 4, name: "Moyens", weight: "1.5 - 1.6 kg", price: 3300, image: "https://images.unsplash.com/photo-1587593819583-6c44a2ca65e5?w=400", bgColor: "#fff3e0" },
            { id: 5, name: "Moyens-grands", weight: "1.7 - 1.9 kg", price: 3500, image: "https://images.unsplash.com/photo-1587593819583-6c44a2ca65e5?w=400", bgColor: "#fff3e0" },
            { id: 6, name: "Grands", weight: "2.0 kg", price: 3700, image: "https://images.unsplash.com/photo-1587593819583-6c44a2ca65e5?w=400", bgColor: "#fff3e0" },
            { id: 7, name: "Très grands", weight: "2.1 - 2.3 kg", price: 4000, image: "https://images.unsplash.com/photo-1587593819583-6c44a2ca65e5?w=400", bgColor: "#fff3e0" },
            { id: 8, name: "Géants", weight: "+2.4 kg", price: 4500, image: "https://images.unsplash.com/photo-1587593819583-6c44a2ca65e5?w=400", bgColor: "#fff3e0" }
        ];

        let cart = [];

        // Charger les produits
        function loadProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            categories.forEach(cat => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-image" style="background-image: url('${cat.image}'); background-color: ${cat.bgColor};">
                        <div class="product-badge">${cat.weight}</div>
                    </div>
                    <div class="product-info">
                        <div class="product-name">${cat.name}</div>
                        <div class="product-weight">${cat.weight}</div>
                        <div class="product-price">${cat.price.toLocaleString('fr-FR')} <small>F CFA</small></div>
                        <div class="quantity-control">
                            <button class="quantity-btn" onclick="changeQuantity(${cat.id}, -1)">-</button>
                            <span class="quantity-value" id="qty-${cat.id}">0</span>
                            <button class="quantity-btn" onclick="changeQuantity(${cat.id}, 1)">+</button>
                        </div>
                        <button class="add-to-cart" onclick="addToCart(${cat.id})">
                            <i class="fas fa-cart-plus"></i> Ajouter au panier
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        let quantities = {};

        function changeQuantity(id, delta) {
            const cat = categories.find(c => c.id === id);
            if (!cat) return;
            
            quantities[id] = (quantities[id] || 0) + delta;
            if (quantities[id] < 0) quantities[id] = 0;
            
            document.getElementById(`qty-${id}`).textContent = quantities[id];
        }

        function addToCart(id) {
            const qty = quantities[id] || 0;
            if (qty === 0) {
                showNotification('Veuillez sélectionner une quantité', 'error');
                return;
            }
            
            const cat = categories.find(c => c.id === id);
            
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.quantity += qty;
            } else {
                cart.push({
                    id: cat.id,
                    name: cat.name,
                    weight: cat.weight,
                    price: cat.price,
                    quantity: qty,
                    subtotal: qty * cat.price
                });
            }
            
            quantities[id] = 0;
            document.getElementById(`qty-${id}`).textContent = '0';
            
            updateCartUI();
            showNotification(`${qty} x ${cat.name} ajouté au panier !`);
        }

        function updateCartUI() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            document.getElementById('cartCount').textContent = count;
            document.getElementById('cartTotal').textContent = total.toLocaleString('fr-FR') + ' F CFA';
            
            const cartItemsDiv = document.getElementById('cartItems');
            if (cart.length === 0) {
                cartItemsDiv.innerHTML = '<div style="text-align: center; padding: 40px; color: #999;">Votre panier est vide</div>';
                return;
            }
            
            cartItemsDiv.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="cart-item-info">
                        <h4>${item.name}</h4>
                        <p>${item.price.toLocaleString('fr-FR')} F CFA</p>
                    </div>
                    <div class="cart-item-actions">
                        <button onclick="updateCartItem(${item.id}, -1)">-</button>
                        <span>${item.quantity}</span>
                        <button onclick="updateCartItem(${item.id}, 1)">+</button>
                        <button onclick="removeCartItem(${item.id})" style="background: #fee2e2; color: #ef4444;">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function updateCartItem(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.quantity += delta;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== id);
                } else {
                    item.subtotal = item.quantity * item.price;
                }
                updateCartUI();
            }
        }

        function removeCartItem(id) {
            cart = cart.filter(i => i.id !== id);
            updateCartUI();
        }

        // Modal gestion
        document.getElementById('cartFab').onclick = () => {
            document.getElementById('cartModal').classList.add('active');
        };
        
        document.getElementById('closeCartBtn').onclick = () => {
            document.getElementById('cartModal').classList.remove('active');
        };
        
        document.getElementById('checkoutBtn').onclick = () => {
            if (cart.length === 0) {
                showNotification('Votre panier est vide', 'error');
                return;
            }
            document.getElementById('cartModal').classList.remove('active');
            document.getElementById('formModal').classList.add('active');
        };

        // Fermer modals en cliquant dehors
        document.getElementById('cartModal').onclick = (e) => {
            if (e.target === document.getElementById('cartModal')) {
                document.getElementById('cartModal').classList.remove('active');
            }
        };
        
        document.getElementById('formModal').onclick = (e) => {
            if (e.target === document.getElementById('formModal')) {
                document.getElementById('formModal').classList.remove('active');
            }
        };

        // Soumettre commande
        document.getElementById('orderForm').onsubmit = async (e) => {
            e.preventDefault();
            
            const fullName = document.getElementById('fullName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const address = document.getElementById('address').value.trim();
            const email = document.getElementById('email').value.trim();
            
            if (!fullName || !phone || !address) {
                showNotification('Veuillez remplir tous les champs obligatoires', 'error');
                return;
            }
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            
            const order = {
                client: {
                    name: fullName,
                    phone: phone,
                    address: address,
                    email: email || null
                },
                items: cart.map(item => ({
                    id: item.id,
                    name: item.name,
                    weight: item.weight,
                    price: item.price,
                    quantity: item.quantity,
                    subtotal: item.price * item.quantity
                })),
                total: total,
                status: 'en_attente', // en_attente, en_livraison, livre, paye, partiel, impaye
                paymentStatus: 'impaye',
                paymentReceived: 0,
                paymentRemaining: total,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                orderNumber: 'CMD-' + Date.now() + '-' + Math.floor(Math.random() * 1000)
            };
            
            try {
                await db.collection('orders').add(order);
                showNotification('Commande envoyée avec succès ! Nous vous contacterons.', 'success');
                
                // Réinitialiser
                cart = [];
                quantities = {};
                updateCartUI();
                document.getElementById('orderForm').reset();
                document.getElementById('formModal').classList.remove('active');
                
                // Recharger les quantités affichées
                categories.forEach(cat => {
                    if (document.getElementById(`qty-${cat.id}`)) {
                        document.getElementById(`qty-${cat.id}`).textContent = '0';
                    }
                });
                
            } catch (error) {
                console.error(error);
                showNotification('Erreur lors de l\'envoi', 'error');
            }
        };

        function showNotification(msg, type = 'success') {
            const notif = document.getElementById('notification');
            notif.style.background = type === 'success' ? '#10b981' : '#ef4444';
            notif.textContent = msg;
            notif.style.display = 'block';
            setTimeout(() => {
                notif.style.display = 'none';
            }, 2000);
        }

        loadProducts();
    </script>
</body>
</html>
